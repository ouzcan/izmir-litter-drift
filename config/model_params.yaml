# OpenDrift koşu parametreleri — temel değerler ve duyarlılık aralıkları
model: OceanDrift            # başlangıç; PlastDrift ile karşılaştırılacak
time_step_s: 900             # 15 dk
output_step_s: 3600          # 1 saat
max_age_days: 60

windage:
  base: 0.02                 # %2
  sensitivity: [0.01, 0.02, 0.03]
stokes_drift: true
horizontal_diffusivity_m2s:
  base: 5
  sensitivity: [1, 10]
beaching:
  method: distance           # LOCATE: mesafe tabanlı
  coastline_action: stranding
  refloat_probability: 0.0   # senaryo: 0.0 ve 0.1

release:
  particles_per_source_per_hour: 5
  test_run:
    site: P_bostanli
    n_particles: 100
    duration_days: 3

forcing:
  currents: "cmems_mod_med_phy-cur_anfc_4.2km-2D_PT1H-m"   # MED MFC analiz/tahmin, yüzey (2D), saatlik ortalama (uo, vo) — katalogdan doğrulandı 2026-09-19
  currents_reanalysis: "cmems_mod_med_phy-cur_my_4.2km_PT1H-m"   # MEDSEA_MULTIYEAR_PHY_006_004, saatlik (3D; yüzey katmanı seçilir) — doğrulandı
  waves: "cmems_mod_med_wav_anfc_4.2km_PT1H-i"            # Stokes drift (VSDX, VSDY), VHM0 — doğrulandı
  wind: "ERA5 reanalysis-era5-single-levels (u10, v10)"

# Faz 3 — Delft3D FM (D-Flow FM) körfez modeli
dflowfm:
  model_name: izmir
  domain_id: B_model
  base_dxy_deg: 0.005          # taban ağ ~450 m (D-B) × 550 m (K-G)
  min_edge_m: 100              # en ince kenar (iç körfez, ~110 m çıkar)
  max_courant_time_s: 20       # dalga-Courant inceltme: sığ yer = küçük hücre (10 m derinlikte ~200 m, 5 m'de ~140 m)
  bnd_land_buffer_deg: 0.01    # açık sınırı karadan uzak tut (~1 km)
  bnd_point_spacing_deg: 0.02  # sınır noktaları ~2 km
  open_edges: [north, west]    # açık sınır yalnız bu kutu kenarlarında; doğu ve güney kara
  bedlevel_clip_max_m: 5
  ref_date: "2025-01-01"
  dtmax_s: 30
  map_interval_s: 3600
  kmx: 10                      # 3D sigma katman sayısı
  nproc: 4
  # Copernicus MED analiz/tahmin kimlikleri (katalogdan doğrulandı 2026-09-19). Yıllık koşu için 'my'/'myint' sürümleri kullanılacak.
  cmems_datasets:
    zos: cmems_mod_med_phy-ssh_anfc_4.2km-2D_PT1H-m     # su seviyesi, saatlik
    so: cmems_mod_med_phy-sal_anfc_4.2km_P1D-m          # tuzluluk 3D, günlük ort.
    thetao: cmems_mod_med_phy-tem_anfc_4.2km_P1D-m      # sıcaklık 3D, günlük ort.
    uo: cmems_mod_med_phy-cur_anfc_4.2km_P1D-m          # akıntı 3D, günlük ort.
    vo: cmems_mod_med_phy-cur_anfc_4.2km_P1D-m

# Faz 3 — SCHISM (Delft3D FM lisans istediği için çekirdek SCHISM)
schism:
  run_name: izmir
  min_depth_m: 1.0          # kıyı düğümlerinde en az derinlik (LAT altı)
  max_fill_dist_m: 600      # EMODnet'te NaN kalan düğüm için en yakın deniz hücresi arama yarıçapı; ötesi kara sayılır
  min_open_nodes: 6         # bundan kısa kutu-kenarı parçaları açık sınır sayılmaz
  min_open_depth_m: 0       # 0 = kapalı. 30 ile denendi: açık sınır ortasında kara duvarları oluştu, 2. günde 7 m/s jet (kötü). Sığ uçlar hız koşuluyla (ifltype=-4) tutuluyor.
  uv_relax_in: 1.0          # ifltype=-4: içeri akışta CMEMS hızına tam bağla
  uv_relax_out: 0.3         # dışarı akışta zayıf bağla (iç çözüm dışarı çıkabilsin)
  ihorcon: 1                # yatay viskozite (Laplacian), sınır gürültüsünü söndürür
  hvis_coef0: 0.025
  bnd3d_dt_s: 21600         # uv/T/S sınır kayıt aralığı (günlük CMEMS → 6 saatlik interpolasyon)
  nvrt: 2                   # 2D için 2 (ivcor=2); 3D'de 11 (10 katman)
  dt_s: 60
